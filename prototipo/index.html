<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jão Burguer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F2B01E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#EFEAE0; --ink:#211B15; --muted:#6E6558;
  --line:#E6DFD2; --line-strong:#CDC3B0; --accent:#C85417; --accent-ink:#FFFFFF; --accent-soft:#F7E3D3;
  --danger:#A32820; --danger-soft:#F4E0DC; --ok:#3E7A46; --ok-soft:#E4EEE0; --warn:#B9791A; --warn-soft:#F6EAD0;
  --scrim:rgba(25,16,10,.5); --amber:#F2B01E;
  --sans:"Libre Franklin",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabbar-h:60px; --cartbar-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14171B; --surface:#1B1F24; --surface-2:#242A31; --ink:#E6E9ED; --muted:#98A1AB;
    --line:#2C333B; --line-strong:#414A54; --accent:#7FA8D4; --accent-ink:#0E1826; --accent-soft:#1E2A3A;
    --danger:#E28B84; --danger-soft:#34211F; --ok:#79C08C; --ok-soft:#1E3026; --warn:#D6A85A; --warn-soft:#33291A;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14171B; --surface:#1B1F24; --surface-2:#242A31; --ink:#E6E9ED; --muted:#98A1AB;
  --line:#2C333B; --line-strong:#414A54; --accent:#7FA8D4; --accent-ink:#0E1826; --accent-soft:#1E2A3A;
  --danger:#E28B84; --danger-soft:#34211F; --ok:#79C08C; --ok-soft:#1E3026; --warn:#D6A85A; --warn-soft:#33291A;
  --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* evita zoom automático no iOS */
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:19px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer;font-weight:500;touch-action:manipulation}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{filter:brightness(.92)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.lg{min-height:52px;font-size:16px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn.text{border:0;background:none;color:var(--accent);padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.btn.text.red{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
input[type=text],input[type=password],select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;min-height:46px;padding:8px 12px;width:100%}
label.field{display:grid;gap:6px}
label.field > span{font-size:13px;font-weight:500;color:var(--muted)}

/* estrutura */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.brand .mark{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--mono);font-weight:500}
.topnav{display:none}
.userbtn{margin-left:auto;display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;min-height:44px;padding:0;text-align:right;line-height:1.2}
.userbtn b{display:block;font-weight:500;font-size:14px}
.userbtn span{font-size:12.5px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink)!important}
main{padding:16px;padding-bottom:calc(16px + var(--tabbar-h) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-width:1280px;margin:0 auto;width:100%}
main.has-cart{padding-bottom:calc(28px + var(--tabbar-h) + var(--cartbar-h) + env(safe-area-inset-bottom,0px))}
main.no-tabbar{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;min-height:var(--tabbar-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--accent)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;font-family:var(--mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.reqs{border:1px dashed var(--line-strong);padding:10px 12px;font-size:12.5px;color:var(--muted);border-radius:4px;background:var(--surface-2)}
.reqs b{color:var(--ink);font-weight:500}
.page-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* status em texto */
.st{font-weight:500;white-space:nowrap;font-size:13.5px}
.st::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:1px;background:currentColor;border-radius:1px}
.st.pend{color:var(--warn)} .st.pago{color:var(--ok)} .st.canc{color:var(--danger)} .st.neutro{color:var(--muted)}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:4px;font-size:14px;max-width:520px;margin:0 auto}
.toast.up{bottom:calc(var(--tabbar-h) + var(--cartbar-h) + 22px + env(safe-area-inset-bottom,0px))}

/* login */
.login{max-width:420px;margin:0 auto;width:100%;display:grid;gap:20px;padding-top:12px}
.login-h{display:grid;gap:4px;text-align:center;justify-items:center}
.login-h .mark{width:48px;height:48px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500;margin-bottom:6px}
.userlist{display:grid;overflow:hidden}
.userlist button{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.userlist button:last-child{border-bottom:0}
.userlist button .who{flex:1;line-height:1.25}
.userlist button .who span{display:block;font-size:13px;color:var(--muted)}
.userlist button .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto}
.userlist button[aria-pressed="true"]{background:var(--accent-soft)}
.userlist button[aria-pressed="true"] .radio{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--accent-soft);background:var(--accent)}
.pin-dots{display:flex;justify-content:center;gap:14px;padding:6px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pin-dots i.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:56px;font-size:20px;font-family:var(--mono);border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer;touch-action:manipulation}
.keypad button:active{background:var(--surface-2)}
.keypad button.fn{font-family:var(--sans);font-size:14px;font-weight:500}
.keypad button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.keypad button:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--danger);font-size:14px}

/* PDV */
.pdv{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.pdv > *{min-width:0}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.cats{display:flex;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:0 4px;background:var(--surface)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:0;background:none;padding:0 12px;min-height:46px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.cats button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.plist{display:grid;border-radius:0 0 4px 4px}
.plist button{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;touch-action:manipulation}
.plist button:last-child{border-bottom:0}
.plist button:active{background:var(--surface-2)}
.plist .info{flex:1;min-width:0;line-height:1.3}
.plist .nm{font-weight:500}
.plist .sub{display:block;font-size:13px;color:var(--muted)}
.plist .incart{display:block;font-size:13px;color:var(--accent);font-weight:500}
.plist .pr{font-family:var(--mono);font-size:14px;white-space:nowrap}
.plist .plus{width:32px;height:32px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--accent);flex:0 0 auto}
.plist button:disabled{cursor:not-allowed}
.plist button:disabled .nm,.plist button:disabled .pr{color:var(--muted)}
.plist button:disabled .plus{visibility:hidden}
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));z-index:5;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.cartbar.solo{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.cartbar button{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:500;cursor:pointer}
.cartbar .count{font-family:var(--mono);min-width:26px;height:26px;border-radius:13px;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:13px}
.order-aside{display:none}
.order-items{list-style:none;margin:0;padding:0}
.order-items li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.order-items li:first-child{padding-top:0}
.order-items .det{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.order-items .det .sem{color:var(--danger)}
.order-items .ctrl{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;flex:0 0 auto}
.qty button{width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:18px;touch-action:manipulation}
.qty span{min-width:24px;text-align:center;font-family:var(--mono)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.total{font-size:22px;font-weight:600}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;background:var(--surface);min-height:44px;cursor:pointer;font-weight:500;padding:0 8px}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg .n{font-family:var(--mono);font-size:13px;margin-left:6px;opacity:.75}
.mesas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mesas button{min-height:52px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer;line-height:1.15;font-weight:500}
.mesas button span{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.mesas button.ocup span{color:var(--warn)}
.mesas button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

/* cozinha */
.kds{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.kds > section{display:none}
.kds > section.on{display:block}
.col-h{display:none}
.tickets{display:grid;gap:12px}
.ticket{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px}
.ticket.late{border-color:var(--danger);border-width:2px}
.ticket-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ticket-h .id{font-family:var(--mono);font-size:20px;font-weight:500}
.ticket.late .ticket-h{background:var(--danger-soft)}
.ticket .late-lbl{color:var(--danger);font-weight:600}
.ticket ul{list-style:none;margin:0;padding:12px 14px;display:grid;gap:10px}
.ticket li b{font-weight:600;font-size:16px}
.ticket li .mods{font-size:14px;color:var(--muted);margin-top:2px}
.ticket li .mods .sem{color:var(--danger);font-weight:500}
.ticket-f{display:grid;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.ticket-f .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}

/* caixa */
.caixa-head{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:14px;margin:0}
.caixa-head div{display:grid;gap:2px}
.caixa-head dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.caixa-head dd{margin:0;font-weight:500}
.subtabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 1 auto;border:0;background:none;padding:6px 8px;min-height:46px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;font-size:14px;line-height:1.2;white-space:normal;text-align:center}
.subtabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.plain-list{list-style:none;margin:0;padding:0}
.plain-list > li{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.plain-list > li:last-child{border-bottom:0}
.plain-list .l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plain-list .l1 .id{font-family:var(--mono);font-weight:500}
.plain-list .l2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pad{padding:14px;display:grid;gap:14px}
.fech-row{display:grid;grid-template-columns:1fr 140px;gap:6px 12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.fech-row .calc{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
.fech-row .dif{grid-column:1 / -1;font-size:14px}
.fech-row input{text-align:right;font-family:var(--mono)}
.dif-sobra{color:var(--ok);font-weight:500}
.dif-falta{color:var(--danger);font-weight:500}
.notice{padding:12px 14px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:4px;font-size:14px}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.notice.ok{border-color:var(--ok);background:var(--ok-soft)}

/* sheet: painel inferior no celular, diálogo no desktop */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:12px;padding:4px 4px 8px 16px;border-bottom:1px solid var(--line);min-height:52px}
.sheet-h h2{flex:1}
.sheet-h .x{width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:26px;line-height:1;color:var(--muted)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:8px auto 0;flex:0 0 auto}
.sheet-body{flex:1 1 auto;min-height:0;align-content:start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:grid;gap:20px;overscroll-behavior:contain}
.sheet-f{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--surface);flex-wrap:wrap}
.sheet-f .grow{flex:1}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;width:100%}
legend .regra{font-weight:400;font-size:13px;color:var(--muted);text-align:right}
legend .regra.bad{color:var(--danger);font-weight:500}
.opts{display:grid;border:1px solid var(--line);border-radius:4px}
.opts.bad{border-color:var(--danger)}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;margin:0}
.opt .p{margin-left:auto;font-family:var(--mono);font-size:13.5px;color:var(--muted)}
.opt.off{opacity:.45;cursor:not-allowed}
.sumbox{display:grid;gap:6px;padding:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px}
.sumbox .big{font-size:26px;font-weight:600}
.payline{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:14px}
.quick button:active{background:var(--surface-2)}
.troco{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.troco b{font-size:20px}
.menu-list{display:grid}
.menu-list > *{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.menu-list > *:last-child{border-bottom:0}
.switch{position:relative;width:48px;height:28px;flex:0 0 auto}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:14px;background:var(--line-strong);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(20px)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}

/* mesas */
.mesa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mesa-card{display:grid;gap:4px;align-content:start;text-align:left;padding:14px;min-height:108px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer}
.mesa-card.ocup{border-color:var(--warn);border-width:2px;padding:13px}
.mesa-card .mesa-n{font-weight:600;font-size:16px}
.conta-ped{display:grid;gap:10px;padding-bottom:14px;border-bottom:2px solid var(--line)}
.tap > li{padding:0}
.rowbtn{display:grid;gap:6px;width:100%;text-align:left;border:0;background:none;padding:14px;cursor:pointer}
.rowbtn:active{background:var(--surface-2)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:10px}

/* relatórios */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:0}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpi dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi dd{margin:0;font-size:20px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
.charts{display:grid;gap:22px}
.chart{display:grid;gap:10px;min-width:0}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:56px minmax(0,1fr) 88px;gap:10px;align-items:center;font-size:13.5px}
.bars.wide .bar-row{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 64px}
.bar-row .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row.hi .bl{font-weight:600}
.bt{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0}
.bt i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar-row .bv{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* tabelas e campos com unidade */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--surface-2)}
td.nao{color:var(--muted)}
.unit{display:flex;align-items:center;gap:8px}
.unit input{text-align:right;font-family:var(--mono)}
.cfg-row{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center}

/* tablet e desktop */
@media (min-width: 900px){
  .tabbar,.cartbar{display:none}
  main,main.has-cart{padding-bottom:24px}
  .toast,.toast.up{bottom:24px}
  .topnav{display:flex;align-self:stretch;margin-left:16px}
  .topnav button{border:0;background:none;padding:0 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500}
  .topnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
  .pdv{grid-template-columns:minmax(0,1fr) 380px}
  .order-aside{display:grid;gap:14px;padding:16px;position:sticky;top:72px}
  .kds{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kds > section{display:block}
  .kds-seg{display:none}
  .col-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px;border-bottom:2px solid var(--ink);margin-bottom:12px}
  .caixa-head{grid-template-columns:repeat(5,auto);justify-content:start;gap:12px 36px}
  .subtabs button{flex:0 0 auto;padding:6px 14px;font-size:15px}
  .mesa-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .charts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scrim{align-items:flex-start;padding:6vh 16px 16px}
  .sheet{border-radius:6px;max-height:88vh}
  .grab{display:none}
}

:root{ --tr:.14s cubic-bezier(.2,.6,.2,1); }

/* vendas de exemplo para os relatórios (geradas de forma determinística) */
function gerarVendas(dias,seed){
  let x = seed; const rnd = () => { x = (x*1664525+1013904223)%4294967296; return x/4294967296; };
  const pick = arr => { const tot = arr.reduce((s,a)=>s+a[1],0); let r = rnd()*tot; for (const a of arr){ r-=a[1]; if (r<=0) return a[0]; } return arr[arr.length-1][0]; };
  const pesoHora = [[17,3],[18,7],[19,11],[20,14],[21,10],[22,6],[23,3]];
  const pesoCat = {"Sanduíches":4,"Hot dogs":4,"Porções":2,"Bebidas":3,"Combos":2};
  const vendaveis = PRODUTOS.filter(p=>!p.indisponivel).map(p=>[p,pesoCat[p.cat]]);
  const out = [];
  for (let d=0; d<dias; d++){
    const fator = 0.8 + rnd()*0.6;
    for (const [h,peso] of pesoHora){
      const n = Math.round(peso*fator*1.3);
      for (let i=0;i<n;i++){
        const origem = pick([["Balcão",35],["Mesa/comanda",30],["iFood",25],["99Food",10]]);
        const itens = []; const k = 1 + Math.floor(rnd()*3);
        for (let j=0;j<k;j++){ const p = pick(vendaveis); const extra = p.grupos.includes("adicionais") && rnd()<0.4 ? 3 : 0; itens.push({nome:p.nome,qty:1,valor:p.preco+extra}); }
        const total = itens.reduce((s,i)=>s+i.valor,0);
        const delivery = origem==="iFood"||origem==="99Food";
        out.push({hora:h,origem,itens,total,preparo:Math.round(9+rnd()*14+(delivery?6:0)),cancelado:rnd()<0.03,
          forma: delivery ? "Plataforma" : pick([["Dinheiro",30],["Cartão",40],["Pix",30]])});
      }
    }
  }
  return out;
}

function mods(it){
  const parts=[], by = g => it.escolhas.filter(e=>e.grupo===g).map(e=>e.nome);

    if (el){ el.focus({preventScroll:true}); if (selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selStart);}catch(e){} } }
  }
}

/* Caixa */
function esperado(){
  const c = state.caixa, soma = f => c.recebimentos.filter(r=>r.forma===f).reduce((s,r)=>s+r.valor,0);
  const sup = c.movs.filter(m=>m.tipo==="Suprimento").reduce((s,m)=>s+m.valor,0);
  const san = c.movs.filter(m=>m.tipo==="Sangria").reduce((s,m)=>s+m.valor,0);
  return {"Dinheiro":c.inicial+soma("Dinheiro")+sup-san,"Cartão":soma("Cartão"),"Pix":soma("Pix"),_rec:{"Dinheiro":soma("Dinheiro")},_sup:sup,_san:san};
}

function difTxt(d){ if (Math.abs(d)<0.005) return "Sem diferença"; return (d>0?"Sobra de ":"Falta de ")+brl(Math.abs(d)); }
const difCls = d => d>0.004?'dif-sobra':d<-0.004?'dif-falta':'';
function renderFechamento(){
  const c = state.caixa, e = esperado();
  if (c.fechado){
    const r = c.fechado;
    const rows = ["Dinheiro","Cartão","Pix"].map(f=>{const d=r.inf[f]-r.esp[f];return '<li><div class="l1"><span>'+f+'</span><span class="num">'+brl(r.inf[f])+'</span></div><div class="l1 small"><span class="muted">Esperado '+brl(r.esp[f])+'</span><span class="'+difCls(d)+'">'+difTxt(d)+'</span></div></li>';}).join("");
    return '<div class="pad"><div class="notice ok">Caixa fechado às '+hhmm(r.t)+' por '+esc(r.por)+'.</div></div><ul class="plain-list">'+rows+'</ul>'+
      '<div class="pad" style="border-top:1px solid var(--line)"><h3>Abrir caixa</h3><p class="small muted">Operador responsável: '+esc(state.user.nome)+'</p>'+
      '<label class="field"><span>Valor inicial na gaveta (R$)</span><input type="text" id="in-inicial" data-act="inicial" inputmode="decimal" value="'+esc(state.abrirValor)+'" class="num"></label>'+
      '<button class="btn primary lg block" data-act="abrircaixa">Abrir caixa</button></div>';
  }
  let totE=0,totI=0,allFilled=true;
  const rows = ["Dinheiro","Cartão","Pix"].map(f=>{
    const raw = c.informado[f]; const inf = parseMoney(raw); if (raw==="") allFilled=false;
    totE+=e[f]; totI+=inf; const d = inf-e[f];
    return '<div class="fech-row"><div><div style="font-weight:500">'+f+'</div><div class="small muted">Esperado <span class="num">'+brl(e[f])+'</span></div></div>'+
      '<input type="text" id="in-inf-'+f+'" data-act="inf" data-v="'+f+'" inputmode="decimal" placeholder="Contado" value="'+esc(raw)+'" aria-label="Valor contado em '+f+'">'+
      (f==="Dinheiro"?'<div class="calc">Inicial '+brl(c.inicial)+' + recebido '+brl(e._rec.Dinheiro)+' + suprimento '+brl(e._sup)+' − sangria '+brl(e._san)+'</div>':'')+
      '<div class="dif '+(raw===""?'muted':difCls(d))+'">'+(raw===""?'Informe o valor contado':difTxt(d))+'</div></div>';
  }).join("");
  const dt = totI-totE;
  return '<div class="pad" style="padding-bottom:0"><p class="small muted">Conte a gaveta e confira os comprovantes de cartão e Pix. O sistema mostra sobra ou falta por forma de pagamento.</p></div>'+rows+

    '<button class="btn primary lg block" data-act="fechar"'+(allFilled?'':' disabled')+'>Fechar caixa</button></div>';
}

function bars(titulo,rows,cls,nota){
  const max = Math.max(1,...rows.map(r=>r.v));
  return '<div class="chart"><h3>'+titulo+'</h3><div class="bars'+(cls?' '+cls:'')+'">'+rows.map(r=>
    '<div class="bar-row'+(r.hi?' hi':'')+'" title="'+esc(r.tip)+'"><span class="bl">'+esc(r.l)+'</span><span class="bt"><i style="width:'+(r.v/max*100).toFixed(1)+'%"></i></span><span class="bv">'+r.d+'</span></div>').join("")+'</div>'+
    (nota?'<p class="small muted">'+nota+'</p>':'')+'</div>';
}
function renderRelatorios(){
  const all = VENDAS[state.relPeriodo], v = all.filter(x=>!x.cancelado), canc = all.filter(x=>x.cancelado);
  const fat = v.reduce((s,x)=>s+x.total,0), ticket = v.length ? fat/v.length : 0;
  const prep = v.length ? Math.round(v.reduce((s,x)=>s+x.preparo,0)/v.length) : 0;
  const seg = '<div class="seg">'+[["ontem","Ontem"],["semana","Últimos 7 dias"]].map(([k,l])=>'<button data-act="relp" data-v="'+k+'" aria-pressed="'+(state.relPeriodo===k)+'">'+l+'</button>').join("")+'</div>';
  const kpis = '<dl class="kpis">'+[["Faturamento",brl(fat)],["Pedidos",String(v.length)],["Ticket médio",brl(ticket)],["Preparo médio",prep+" min"]].map(([a,b])=>'<div class="kpi"><dt>'+a+'</dt><dd>'+b+'</dd></div>').join("")+'</dl>'+
    '<p class="small muted">'+canc.length+(canc.length===1?' pedido cancelado':' pedidos cancelados')+' ('+brl(canc.reduce((s,x)=>s+x.total,0))+'), fora do faturamento.</p>';
  const horas = [17,18,19,20,21,22,23].map(h=>{ const hs=v.filter(x=>x.hora===h); return {h,n:hs.length,val:hs.reduce((s,x)=>s+x.total,0)}; });
  const pico = horas.reduce((a,b)=>b.n>a.n?b:a);
  const faixa = bars("Pedidos por faixa de horário", horas.map(x=>({l:x.h+"h",v:x.n,d:x.n+" ped.",hi:x===pico,tip:x.h+"h às "+(x.h+1)+"h: "+x.n+" pedidos, "+brl(x.val)})), "",
    "Maior movimento: "+pico.h+"h às "+(pico.h+1)+"h, com "+pico.n+" pedidos ("+Math.round(pico.n/Math.max(1,v.length)*100)+"% do período).");
  const origem = bars("Vendas por origem", ORIGENS.map(o=>{ const os=v.filter(x=>x.origem===o), val=os.reduce((s,x)=>s+x.total,0); return {l:o==="Mesa/comanda"?"Mesa":o,v:val,d:brl(val),tip:o+": "+os.length+" pedidos, "+brl(val)}; }));
  const cont = {}; v.forEach(x=>x.itens.forEach(i=>{ cont[i.nome]=(cont[i.nome]||0)+i.qty; }));
  const top = Object.entries(cont).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const prods = bars("Produtos mais vendidos", top.map(([n,q])=>({l:n,v:q,d:q+" un.",tip:n+": "+q+" unidades"})), "wide");
  const formas = bars("Formas de pagamento", ["Dinheiro","Cartão","Pix","Plataforma"].map(f=>{ const val=v.filter(x=>x.forma===f).reduce((s,x)=>s+x.total,0); return {l:f==="Plataforma"?"Delivery":f,v:val,d:brl(val),tip:f+": "+brl(val)}; }), "", "Delivery é pago na própria plataforma (iFood e 99Food).");
  return '<div class="pad">'+seg+kpis+'<div class="charts">'+faixa+origem+prods+formas+'</div><p class="small muted">Dados de exemplo para o protótipo. Só pedidos concluídos entram no faturamento.</p></div>';

    '<div class="grab"></div><div class="sheet-h"><div style="flex:1;min-width:0"><h2 id="st">'+title+'</h2>'+(sub?'<div class="small muted">'+sub+'</div>':'')+'</div><button class="x" data-act="close" aria-label="Fechar">×</button></div>'+
    '<div class="sheet-body">'+body+'</div>'+(foot?'<div class="sheet-f">'+foot+'</div>':'')+'</div></div>';

function renderSheet(){
  const m = state.sheet;
  if (m.type==="item") return sheetItem(m);
  if (m.type==="pedido") return sheetFrame('Pedido <span class="mono muted" style="font-weight:400">#'+state.nextId+'</span>',orderPanel(true),orderActions());
  if (m.type==="pag") return sheetPag(m);
  if (m.type==="cancel") return sheetCancel(m);
  if (m.type==="menu") return sheetMenu();
  if (m.type==="mesa") return sheetMesa(m);
  if (m.type==="transf") return sheetTransf(m);
  if (m.type==="desc") return sheetDesc(m);
  if (m.type==="ped") return sheetPed(m);

function sheetItem(m){

    const full = sel.length>=G.max;

      const on = sel.includes(n), off = !on && full && G.max>1, type = G.max===1?"radio":"checkbox";

function quickVals(v){ return [5,10,20,50,100,200].filter(n=>n>v).slice(0,3); }
function pagAlvo(m){
  if (m.draft) return {titulo:'Registrar pagamento', sub:'Pedido #'+state.nextId+', balcão', total:cartTotal(), pago:0, orders:null};
  if (m.mesa){ const os = contaOrders(m.mesa); return {titulo:'Registrar pagamento — mesa '+m.mesa, sub:os.length+(os.length>1?' pedidos na conta':' pedido na conta'), total:os.reduce((s,o)=>s+orderTotal(o),0), pago:os.reduce((s,o)=>s+paidOf(o),0), orders:os}; }
  const o = state.orders.find(x=>x.id===m.orderId);
  return {titulo:'Registrar pagamento <span class="mono">#'+o.id+'</span>', sub:esc(origemLabel(o)), total:orderTotal(o), pago:paidOf(o), orders:[o]};
}
function sheetPag(m){
  const A = pagAlvo(m);
  const devido = r2(A.total-A.pago);
  const soma = r2(m.linhas.reduce((s,l)=>s+parseMoney(l.valor),0));
  const falta = r2(devido-soma);
  const linhas = m.linhas.map((l,i)=>{
    const val = parseMoney(l.valor);
    const troco = l.forma==="Dinheiro" && l.recebido!=="" ? r2(parseMoney(l.recebido)-val) : null;
    return '<div class="payline">'+
      '<div class="row"><span style="font-weight:600">'+(m.linhas.length>1?(m.mesa?'Pessoa ':'Forma ')+(i+1):'Forma de pagamento')+'</span>'+(m.linhas.length>1?'<button class="btn text red" data-act="pdel" data-i="'+i+'">Remover</button>':'')+'</div>'+
      '<div class="seg">'+["Dinheiro","Cartão","Pix"].map(f=>'<button data-act="pforma" data-i="'+i+'" data-v="'+f+'" aria-pressed="'+(l.forma===f)+'">'+f+'</button>').join("")+'</div>'+
      '<label class="field"><span>Valor (R$)</span><input type="text" id="pv-'+i+'" data-act="pvalor" data-i="'+i+'" inputmode="decimal" placeholder="0,00" value="'+esc(l.valor)+'" class="num"></label>'+
      (l.forma==="Dinheiro"?
        '<label class="field"><span>Valor entregue pelo cliente</span><input type="text" id="pr-'+i+'" data-act="precebido" data-i="'+i+'" inputmode="decimal" placeholder="0,00" value="'+esc(l.recebido)+'" class="num"></label>'+
        '<div class="quick"><button data-act="pquick" data-i="'+i+'" data-v="'+val+'">Exato</button>'+quickVals(val).map(n=>'<button data-act="pquick" data-i="'+i+'" data-v="'+n+'">'+n+'</button>').join("")+'</div>'+
        (troco!==null?(troco>=0?'<div class="troco"><span>Troco</span><b class="num">'+brl(troco)+'</b></div>':'<div class="err">O valor entregue é menor que o valor em dinheiro.</div>'):'')
      :'')+
    '</div>';
  }).join("");
  const trocoOk = m.linhas.every(l=>l.forma!=="Dinheiro"||l.recebido===""||parseMoney(l.recebido)>=parseMoney(l.valor));
  const ok = devido>0 && Math.abs(falta)<0.005 && trocoOk && m.linhas.every(l=>parseMoney(l.valor)>0);
  const dividir = m.mesa ? '<div style="display:grid;gap:6px"><span class="small muted" style="font-weight:500">Dividir pagamento entre pessoas</span><div class="quick">'+[2,3,4,5].map(n=>'<button data-act="pdiv" data-v="'+n+'" aria-label="Dividir entre '+n+' pessoas">'+n+'</button>').join("")+'</div></div>' : '';
  const body = '<div class="sumbox"><div class="row small muted"><span>'+(m.mesa?'Consumo da mesa':'Total do pedido')+'</span><span class="num">'+brl(A.total)+'</span></div>'+
      (A.pago?'<div class="row small muted"><span>Já pago</span><span class="num">'+brl(A.pago)+'</span></div>':'')+
      '<div class="row"><span>A receber</span><span class="big num">'+brl(devido)+'</span></div></div>'+
    dividir+linhas+
    '<button class="btn block" data-act="padd">Combinar outra forma de pagamento</button>'+
    (Math.abs(falta)<0.005?'':'<div class="notice '+(falta>0?'warn':'')+'">'+(falta>0?'Faltam <b class="num">'+brl(falta)+'</b> para completar o valor.':'A soma passou do valor a receber em <b class="num">'+brl(-falta)+'</b>.')+'</div>')+
    (m.draft?'<p class="small muted">O pedido vai para a cozinha assim que o pagamento for registrado.</p>':'');
  const lbl = m.draft ? 'Registrar e enviar para a cozinha' : 'Registrar pagamento';
  return sheetFrame(A.titulo,body,'<button class="btn primary lg block" data-act="confirmpag"'+(ok?'':' disabled')+'>'+lbl+'</button>',A.sub);
}

/* ---------- ações ---------- */
function flash(msg){ state.toast = msg; renderToast(); clearTimeout(flash.t); flash.t = setTimeout(()=>{ state.toast=""; renderToast(); },3000); }
function openItem(prodId,editIndex){
  const back = !!(state.sheet && state.sheet.type==="pedido");
  if (editIndex!=null){
    const it = state.cart.itens[editIndex], sel={};
    it.escolhas.forEach(e=>{ (sel[e.grupo]=sel[e.grupo]||[]).push(e.nome); });
    state.sheet = {type:"item",prodId,sel,rem:[...it.remocoes],obs:it.obs,qty:it.qty,editIndex,tried:false,back};
  } else state.sheet = {type:"item",prodId,sel:{},rem:[],obs:"",qty:1,editIndex:null,tried:false,back};
}
function criarPedido(){
  const c = state.cart;
  const o = {id:state.nextId++,origem:c.origem,mesa:c.origem==="Mesa/comanda"?c.mesa:null,externoId:null,pagoExterno:false,
    itens:c.itens.map(i=>Object.assign({},i)),desconto:c.desconto?{valor:Math.min(c.desconto.valor,cartSub()),motivo:c.desconto.motivo,por:c.desconto.por}:null,
    status:"Recebido",historico:[{status:"Recebido",t:now()}],pagamentos:[],criadoEm:now(),usuario:state.user.nome};
  state.orders.push(o);
  state.cart = {origem:c.origem,mesa:null,itens:[],desconto:null};
  return o;
}
function voltar(m){
  if (!m) return null;
  if (m.back) return {type:"pedido"};
  if (m.backPed) return {type:"ped",orderId:m.orderId};
  if (m.backMesa && contaOrders(m.backMesa).length) return {type:"mesa",mesa:m.backMesa};
  return null;
}
function reprocessar(f){
  if (!state.integ[f.plataforma].online){ flash(f.plataforma+" ainda está fora do ar. Tente de novo quando a conexão voltar."); return; }
  const existe = state.orders.find(o=>o.origem===f.plataforma && o.externoId===f.externoId);
  if (existe){ f.status="ignorado"; f.resultado="Pedido já existia como #"+existe.id+". Nada foi duplicado."; flash(f.resultado); return; }
  const o = {id:state.nextId++,origem:f.plataforma,mesa:null,externoId:f.externoId,pagoExterno:true,itens:f.itens.map(i=>Object.assign({},i)),desconto:null,
    status:"Recebido",historico:[{status:"Recebido",t:now()}],pagamentos:[],criadoEm:now(),usuario:"Integração "+f.plataforma};
  o.pagamentos=[{forma:"Plataforma",valor:orderTotal(o),t:now()}];
  state.orders.push(o);
  f.status="reprocessado"; f.resultado="Importado como pedido #"+o.id+" e enviado para a cozinha.";
  flash("Pedido "+f.plataforma+" nº "+f.externoId+" importado como #"+o.id+"."+impresso());
}
function tryLogin(){
  if (!state.loginSel){ state.loginErr="Escolha quem está entrando."; return; }
  if (state.pin.length!==4){ state.loginErr="Digite os 4 dígitos do PIN."; return; }
  state.user = USERS.find(u=>u.id===state.loginSel); state.screen = ACESSO[state.user.perfil][0]; state.loginErr=""; state.pin="";
  window.scrollTo(0,0);
}

document.addEventListener("click",ev=>{
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a==="closebg"){ if (ev.target===el){ state.sheet=voltar(state.sheet); render(); } return; }
  if (["opt","rem","motivo","req","busca","obs","inf","movvalor","movobs","pvalor","precebido","outro","dval","dmot","cfglim","cfgprint","unome","upin","uperfil","inicial"].includes(a)) return;
  ev.preventDefault();
  const m = state.sheet;
  switch(a){
    case "pickuser": state.loginSel=v; state.loginErr=""; if (state.pin.length===4) tryLogin(); break;
    case "key": if (state.pin.length<4) state.pin+=v; state.loginErr=""; if (state.pin.length===4 && state.loginSel) tryLogin(); break;
    case "keydel": state.pin=state.pin.slice(0,-1); break;
    case "entrar": tryLogin(); break;
    case "menu": state.sheet={type:"menu"}; break;
    case "logout": state.user=null; state.loginSel=null; state.pin=""; state.sheet=null; break;
    case "nav": state.screen=v; window.scrollTo(0,0); break;
    case "pdvtab": state.pdvTab=v; window.scrollTo(0,0); break;
    case "gtab": state.gestaoTab=v; break;
    case "goint": state.screen="gestao"; state.gestaoTab="integracoes"; window.scrollTo(0,0); break;
    case "cat": state.cat=v; state.busca=""; break;
    case "addprod": {
      const p = prod(Number(v));
      if (personalizavel(p)) openItem(p.id,null);
      else { const ex = state.cart.itens.find(i=>i.prodId===p.id && !i.obs); if (ex) ex.qty++; else state.cart.itens.push(item(p.id,1)); flash(p.nome+" adicionado ao pedido."); }
      break; }
    case "opencart": state.sheet={type:"pedido"}; break;
    case "qty": { const i=Number(el.dataset.i), it = state.cart.itens[i]; it.qty += Number(el.dataset.d); if (it.qty<1) state.cart.itens.splice(i,1); if(!state.cart.itens.length && m && m.type==="pedido") state.sheet=null; break; }
    case "delitem": state.cart.itens.splice(Number(el.dataset.i),1); if(!state.cart.itens.length && m && m.type==="pedido") state.sheet=null; break;
    case "edititem": openItem(state.cart.itens[Number(el.dataset.i)].prodId,Number(el.dataset.i)); break;
    case "limpar": state.cart.itens=[]; state.cart.desconto=null; state.sheet=null; break;
    case "origem": state.cart.origem=v; if(v==="Balcão") state.cart.mesa=null; break;
    case "mesa": if(!contaFechada(Number(v))) state.cart.mesa=Number(v); break;
    case "desconto": state.sheet={type:"desc",tipo:"R$",valor:"",motivo:"",back:!!(m&&m.type==="pedido")}; break;
    case "dtipo": m.tipo=v; break;
    case "confirmdesc": { const sub=cartSub(), val = m.tipo==="%" ? r2(sub*parseMoney(m.valor)/100) : parseMoney(m.valor);
      state.cart.desconto={valor:val,motivo:m.motivo.trim(),por:state.user.nome}; state.sheet=voltar(m); flash("Desconto de "+brl(val)+" aplicado por "+state.user.nome+"."); break; }
    case "rmdesc": state.cart.desconto=null; break;
    case "enviar": { const o=criarPedido(); state.sheet=null; flash("Pedido #"+o.id+" enviado para a cozinha."+(o.origem==="Mesa/comanda"?" Lançado na conta da mesa "+o.mesa+".":"")+impresso()); break; }
    case "pagarantes": state.sheet={type:"pag",draft:true,linhas:[{forma:"Dinheiro",valor:fmtIn(cartTotal()),recebido:""}]}; break;
    case "mqty": m.qty=Math.max(1,m.qty+Number(el.dataset.d)); break;
    case "close": state.sheet = voltar(m); break;
    case "confirmitem": {
      const p = prod(m.prodId);
      const faltando = p.grupos.find(g=>(m.sel[g]||[]).length<GRUPOS[g].min);
      if (faltando){ m.tried=true; render(); const fs=document.getElementById("fs-"+faltando); if (fs) fs.scrollIntoView({block:"start"}); return; }
      const esc2 = []; p.grupos.forEach(g=>(m.sel[g]||[]).forEach(n=>esc2.push([g,n])));
      const it = item(p.id,m.qty,esc2,m.rem,m.obs.trim());
      if (m.editIndex!=null) state.cart.itens[m.editIndex]=it; else { state.cart.itens.push(it); flash(p.nome+" adicionado ao pedido."); }
      state.sheet = m.back ? {type:"pedido"} : null; break; }
    case "kdstab": state.kdsTab=v; break;
    case "iniciar": setStatus(state.orders.find(o=>o.id===Number(v)),"Em preparação"); flash("Pedido #"+v+" em preparo."); break;
    case "pronto": setStatus(state.orders.find(o=>o.id===Number(v)),"Pronto"); flash("Pedido #"+v+" pronto para entrega."); break;
    case "retirada": setStatus(state.orders.find(o=>o.id===Number(v)),"Finalizado"); flash("Pedido #"+v+" finalizado."); break;
    case "reimprimir": flash("Comanda do pedido #"+v+" reimpressa."); break;
    case "cfiltro": state.consultaFiltro=v; break;
    case "verpedido": state.sheet={type:"ped",orderId:Number(v)}; break;
    case "abrirmesa": { const n=Number(v);
      if (contaOrders(n).length) state.sheet={type:"mesa",mesa:n};
      else { state.screen="pdv"; state.pdvTab="novo"; state.cart.origem="Mesa/comanda"; state.cart.mesa=n; flash("Mesa "+n+" aberta. Lance os itens do pedido."); }
      break; }
    case "lancar": { const n=Number(v); if(contaFechada(n)){ flash("Conta da mesa "+n+" está fechada. Registre o pagamento antes de novos pedidos."); break; } state.screen="pdv"; state.pdvTab="novo"; state.cart.origem="Mesa/comanda"; state.cart.mesa=n; state.sheet=null; window.scrollTo(0,0); break; }
    case "preconta": flash("Pré-conta da mesa "+v+" impressa. A mesa continua aberta."); break;
    case "transf": state.sheet={type:"transf",orderId:Number(el.dataset.o),idx:Number(el.dataset.i),backMesa:m.mesa}; break;
    case "transfpara": {
      const o = state.orders.find(x=>x.id===m.orderId), dest = Number(v), orig = o.mesa, it = o.itens[m.idx];
      if (contaFechada(dest)){ flash("Mesa "+dest+" está com a conta fechada."); break; }
      if (o.itens.length===1) o.mesa = dest;
      else {
        o.itens.splice(m.idx,1);
        const alvo = contaOrders(dest).slice(-1)[0];
        if (alvo) alvo.itens.push(it);
        else state.orders.push(Object.assign({},o,{id:state.nextId++,mesa:dest,itens:[it],historico:o.historico.slice(),pagamentos:[],desconto:null}));
      }
      state.sheet = contaOrders(orig).length ? {type:"mesa",mesa:orig} : null;
      flash(it.qty+"× "+it.nome+" transferido da mesa "+orig+" para a mesa "+dest+"."); break; }
    case "fecharconta": { const n=Number(v); if(!contaOrders(n).length) break; state.contasFechadas[n]=true;
      flash("Conta da mesa "+n+" fechada. Não aceita novos pedidos. Aguardando pagamento no caixa."); break; }
    case "receberconta": { const n=Number(v), os=contaOrders(n), dev=r2(os.reduce((s,o)=>s+orderTotal(o)-paidOf(o),0));
      state.sheet={type:"pag",mesa:n,backMesa:(m&&m.type==="mesa")?n:null,linhas:[{forma:"Dinheiro",valor:fmtIn(dev),recebido:""}]}; break; }
    case "ctab": state.caixaTab=v; break;
    case "receber": { const o=state.orders.find(x=>x.id===Number(v)); state.sheet={type:"pag",orderId:o.id,linhas:[{forma:"Dinheiro",valor:fmtIn(orderTotal(o)-paidOf(o)),recebido:""}]}; break; }
    case "pforma": m.linhas[Number(el.dataset.i)].forma=v; break;
    case "pquick": m.linhas[Number(el.dataset.i)].recebido=fmtIn(Number(v)); break;
    case "pdiv": { const A=pagAlvo(m), dev=r2(A.total-A.pago), n=Number(v), parte=Math.floor(dev/n*100)/100, forma=m.linhas[0].forma;
      m.linhas = Array.from({length:n},(_,i)=>({forma,valor:fmtIn(i<n-1?parte:r2(dev-parte*(n-1))),recebido:""})); break; }
    case "padd": {
      const A=pagAlvo(m), dev=r2(A.total-A.pago), soma=r2(m.linhas.reduce((s,l)=>s+parseMoney(l.valor),0));
      const usadas = m.linhas.map(l=>l.forma), forma = ["Cartão","Pix","Dinheiro"].find(f=>!usadas.includes(f))||"Cartão";
      m.linhas.push({forma,valor:fmtIn(Math.max(0,dev-soma)),recebido:""}); break; }
    case "pdel": m.linhas.splice(Number(el.dataset.i),1); break;
    case "confirmpag": {
      const orders = m.draft ? [criarPedido()] : pagAlvo(m).orders;
      m.linhas.forEach(l=>{
        let val = parseMoney(l.valor);
        state.caixa.recebimentos.push({pedido:orders[0].id,forma:l.forma,valor:val,t:now()});
        for (const o of orders){ if (val<=0) break; const f=r2(orderTotal(o)-paidOf(o)); if (f<=0) continue; const x=Math.min(f,val); o.pagamentos.push({forma:l.forma,valor:r2(x),t:now()}); val=r2(val-x); }
      });
      const troco = m.linhas.filter(l=>l.forma==="Dinheiro"&&l.recebido!=="").reduce((s,l)=>s+parseMoney(l.recebido)-parseMoney(l.valor),0);
      const tr = troco>0 ? " Troco: "+brl(troco)+"." : "";
      state.sheet=null;
      if (m.draft) flash("Pedido #"+orders[0].id+" pago e enviado para a cozinha."+tr+impresso());
      else if (m.mesa){ const livre=!contaOrders(m.mesa).length; if(livre) delete state.contasFechadas[m.mesa]; flash(livre?"Pagamento da mesa "+m.mesa+" concluído. Mesa liberada."+tr:"Pagamento parcial da mesa "+m.mesa+" registrado. Saldo em aberto."+tr); }
      else flash("Pagamento do pedido #"+orders[0].id+" registrado."+tr);
      break; }
    case "cancelar": state.sheet={type:"cancel",orderId:Number(v),motivo:"",outro:"",backPed:!!(m&&m.type==="ped")}; break;
    case "confirmcancel": {
      const o = state.orders.find(x=>x.id===m.orderId);
      setStatus(o,"Cancelado"); o.motivoCancel = m.motivo==="Outro"?m.outro.trim():m.motivo; o.canceladoPor = state.user.nome;
      state.sheet = m.backPed ? {type:"ped",orderId:o.id} : null; flash("Pedido #"+o.id+" cancelado."); break; }
    case "movtipo": state.movForm.tipo=v; break;
    case "fechar": {
      const e = esperado(), inf={}; ["Dinheiro","Cartão","Pix"].forEach(f=>inf[f]=parseMoney(state.caixa.informado[f]));
      state.caixa.fechado={t:now(),por:state.user.nome,esp:{"Dinheiro":e.Dinheiro,"Cartão":e["Cartão"],"Pix":e.Pix},inf}; window.scrollTo(0,0); break; }
    case "abrircaixa": { const val=parseMoney(state.abrirValor);
      if (val<0 || state.abrirValor.trim()===""){ flash("Informe o valor inicial da gaveta."); return; }
      Object.assign(state.caixa,{operador:state.user.nome,abertura:now(),inicial:val,recebimentos:[],movs:[],informado:{"Dinheiro":"","Cartão":"","Pix":""},fechado:null});
      state.caixaTab="receber"; flash("Caixa aberto por "+state.user.nome+" com "+brl(val)+"."); break; }
    case "relp": state.relPeriodo=v; break;
    case "toggleint": { const i=state.integ[v];
      if (i.online){ i.online=false; i.desde=now();
        state.falhas.push({id:nextFalha++,plataforma:v,externoId:(v==="iFood"?"":"C")+String(8000+Math.floor(Math.random()*999)),t:now(),erro:"Plataforma fora do ar",itens:[item(7,1,[["molhos","Ketchup"]],[]),item(11,1)],status:"pendente",resultado:""});
        flash(v+" fora do ar. Um pedido que chegou agora ficou guardado para reprocessar."); }
      else { i.online=true; i.desde=null; flash(v+" conectado de novo. Reprocesse os pedidos pendentes."); }
      break; }
    case "reprocessar": reprocessar(state.falhas.find(f=>f.id===Number(v))); break;
    case "testprint": flash("Página de teste enviada para a impressora da cozinha."); break;
    case "novousuario": state.sheet={type:"user",nome:"",perfil:"",pin:""}; break;
    case "confirmuser": USERS.push({id:"u"+Date.now(),nome:m.nome.trim(),perfil:m.perfil}); state.sheet=null; flash("Usuário "+m.nome.trim()+" cadastrado com perfil "+m.perfil+"."); break;
  }
  render();
});

document.addEventListener("change",ev=>{
  const el = ev.target, a = el.dataset && el.dataset.act; if(!a) return;
  const m = state.sheet;
  if (a==="req"){ state.showReq = el.checked; }
  else if (a==="cfgprint"){ state.cfg.autoPrint = el.checked; }
  else if (a==="uperfil"){ m.perfil = el.dataset.v; }
  else if (a==="opt"){
    const g = el.dataset.g, G = GRUPOS[g], sel = m.sel[g] = m.sel[g]||[];
    if (G.max===1) m.sel[g]=[el.dataset.v];
    else if (el.checked){ if (sel.length<G.max) sel.push(el.dataset.v); }
    else m.sel[g]=sel.filter(x=>x!==el.dataset.v);
  }
  else if (a==="rem"){ if (el.checked) m.rem.push(el.dataset.v); else m.rem=m.rem.filter(x=>x!==el.dataset.v); }
  else if (a==="motivo"){ m.motivo = el.dataset.v; }
  else return;
  render();
});

document.addEventListener("input",ev=>{
  const el = ev.target, a = el.dataset && el.dataset.act; if(!a) return;
  const m = state.sheet;
  if (a==="busca") state.busca = el.value;
  else if (a==="obs") { m.obs = el.value; return; }
  else if (a==="inf") state.caixa.informado[el.dataset.v] = el.value;
  else if (a==="movvalor") { state.movForm.valor = el.value; return; }
  else if (a==="movobs") { state.movForm.obs = el.value; return; }
  else if (a==="inicial") { state.abrirValor = el.value; return; }
  else if (a==="cfglim") { state.cfg.limites[el.dataset.v] = el.value.replace(/\D/g,""); return; }
  else if (a==="pvalor") m.linhas[Number(el.dataset.i)].valor = el.value;
  else if (a==="precebido") m.linhas[Number(el.dataset.i)].recebido = el.value;
  else if (a==="outro") m.outro = el.value;
  else if (a==="dval") m.valor = el.value;
  else if (a==="dmot") m.motivo = el.value;
  else if (a==="unome") m.nome = el.value;
  else if (a==="upin") m.pin = el.value.replace(/\D/g,"").slice(0,4);
  else return;
  render();
});

document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if (ev.target.id==="form-mov"){
    const f = state.movForm, val = parseMoney(f.valor);
    if (val<=0){ flash("Informe um valor maior que zero."); return; }
    state.caixa.movs.push({tipo:f.tipo,valor:val,obs:f.obs.trim()||"Sem observação",t:now(),usuario:state.user.nome});
    state.movForm={tipo:f.tipo,valor:"",obs:""};
    if (document.activeElement) document.activeElement.blur();
    render();
    flash(f.tipo+" de "+brl(val)+" registrada.");
  }
});

document.addEventListener("keydown",ev=>{
  if (ev.key==="Escape" && state.sheet){ state.sheet=voltar(state.sheet); render(); return; }
  if (!state.user && !(ev.target.closest && ev.target.closest("input"))){
    if (/^\d$/.test(ev.key) && state.pin.length<4){ state.pin+=ev.key; state.loginErr=""; if (state.pin.length===4 && state.loginSel) tryLogin(); render(); }
    else if (ev.key==="Backspace"){ state.pin=state.pin.slice(0,-1); render(); }
    else if (ev.key==="Enter"){ tryLogin(); render(); }
  }
});
window.addEventListener("resize",()=>{ if (state.sheet && state.sheet.type==="pedido" && isDesktop()){ state.sheet=null; render(); } });

setInterval(()=>{
  const ae = document.activeElement;
  if (state.user && state.screen==="cozinha" && !state.sheet && !(ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName))) render();
},20000);

render();
})();
</script>
</body></html>
